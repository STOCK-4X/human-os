<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human OS — offline</title>
    <style>
      :root { --bg: #f6f5f2; --ink: #1b1c1b; --muted: #6c6d68; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0f0f; --ink: #ececea; --muted: #9a9c98; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 0 16px; text-align: center; }
      p { color: var(--muted); max-width: 30ch; margin: 8px auto 0; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div>
      <strong>You're offline</strong>
      <p>This page hasn't been cached yet. Your data is safe on this device. <a href="/">Go to Today</a></p>
    </div>
  </body>
</html>
